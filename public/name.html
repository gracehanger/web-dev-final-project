<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter your name</title>
    <link rel="stylesheet" href="./style.css">
   
</head>
<body>
    <div class="parent-container">
        <form id="userForm" class="submit-container" action="./character-select.html">
            <label for="nameInput" class="enter-name">ENTER YOUR NAME:</label>
            <div class="input-container">
                <input type="text" id="nameInput" class="name-input" placeholder="" required/>
                <button type="submit" class="save-button" id="saveButton">Submit Name</button>
            </div>
            <p id="error-message" class="error-message" style="color: red;"></p>
        </form>
    </div>
    <script>
        const userForm = document.getElementById('userForm');
        const saveButton = document.getElementById('saveButton');
        const errorMessage = document.getElementById('error-message');
        
        userForm.addEventListener('submit', function(e) {
            const rejected = /^[A-Za-z\s]+$/;
            const typedName = document.getElementById('nameInput').value;
            
        if (!rejected.test(typedName)) {
            e.preventDefault();
            errorMessage.textContent = "Name cannot include numbers or special characters";
            console.log("Name cannot include numbers or special characters");
            return; 
        } else {
            errorMessage.textContent = '';
        }
        
        localStorage.setItem('savedName', typedName); //how to get this to send to the API?
        });
    </script>
</body>
</html>
